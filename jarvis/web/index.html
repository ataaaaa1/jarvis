<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS</title><style>
:root{--bg:#04101f;--cyan:#00d8ff;--text:#cfefff}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(1000px 600px at 50% 20%,#072a47,var(--bg));color:var(--text);
font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;min-height:100vh;display:flex;flex-direction:column}
header{padding:14px 16px 6px;text-align:center}
h1{font-size:28px;letter-spacing:6px;color:var(--cyan)}
.sub{opacity:.7;font-size:13px;margin-top:4px}
.orb{display:flex;justify-content:center;padding:16px 0 8px}
.orb-inner{width:130px;height:130px;border-radius:50%;position:relative;display:grid;place-items:center;
background:radial-gradient(circle at 35% 35%,rgba(0,216,255,.55),rgba(0,60,120,.25) 60%,transparent);
border:1px solid rgba(0,216,255,.5)}
.orb-inner::before{content:"";position:absolute;inset:-10px;border-radius:50%;
border:1px dashed rgba(0,216,255,.5);animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#status{font-size:13px;color:var(--cyan)}
#log{flex:1;overflow:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px;min-height:160px;max-height:50vh}
.bubble{max-width:92%;padding:10px 12px;border-radius:14px;white-space:pre-wrap;word-break:break-word;font-size:15px}
.me{align-self:flex-end;background:rgba(0,119,255,.28);border:1px solid rgba(0,216,255,.35)}
.jarvis{align-self:flex-start;background:rgba(0,216,255,.12);border:1px solid rgba(0,216,255,.4)}
.quick{display:flex;flex-wrap:wrap;gap:8px;padding:8px 14px}
.quick button,.bar button{background:rgba(0,216,255,.14);color:var(--cyan);border:1px solid rgba(0,216,255,.45);
border-radius:999px;padding:8px 12px;font-size:13px;touch-action:manipulation}
.bar{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.bar input{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(0,216,255,.4);color:var(--text);
border-radius:999px;padding:12px 16px;font-size:16px;outline:none}
.bar button.mic{border-radius:50%;width:48px;height:48px;font-size:20px;padding:0}
.token-row{display:flex;gap:8px;padding:0 14px}
.token-row input{flex:1;background:transparent;border:1px solid rgba(255,255,255,.18);color:var(--text);
border-radius:10px;padding:8px 10px;font-size:12px}
button:active{transform:scale(.97)}
</style></head><body>
<header><h1>J.A.R.V.I.S</h1><div class="sub">Just A Rather Very Intelligent System</div></header>
<div class="orb"><div class="orb-inner"><span id="status">BAĞLANIYOR…</span></div></div>
<div id="log"></div><div class="quick" id="quick"></div>
<div class="token-row"><input id="token" placeholder="Token (URL ?token=... veya localStorage)"></div>
<div class="bar"><input id="input" placeholder="Emir yazın… (ör. saat, sistem bilgisi, bellek)">
<button id="send">Gönder</button><button id="mic" class="mic">🎤</button></div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const logEl=$("log"),input=$("input"),statusEl=$("status"),tokenEl=$("token");
const q=new URLSearchParams(location.search);
if(q.get("token")){localStorage.setItem("jarvis_token",q.get("token"));history.replaceState({},"",location.pathname)}
tokenEl.value=localStorage.getItem("jarvis_token")||"";
tokenEl.onchange=()=>localStorage.setItem("jarvis_token",tokenEl.value.trim());
function add(text,who){const d=document.createElement("div");d.className="bubble "+who;d.textContent=text;
logEl.appendChild(d);logEl.scrollTop=logEl.scrollHeight;
if(who==="jarvis"&&localStorage.getItem("jarvis_tts")!=="0"&&"speechSynthesis"in window){try{const u=new SpeechSynthesisUtterance(text.slice(0,400));u.lang="tr-TR";speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}}
["saat kaç","sistem bilgisi","bellek","disk","pil","süreçler","ağ bilgisi","yardım","hava durumu istanbul","espri yap","ekran görüntüsü al"]
.forEach(c=>{const b=document.createElement("button");b.textContent=c;b.onclick=()=>send(c);$("quick").appendChild(b)});
let ws=null,rems=1500;
function schedule(){setTimeout(connect,rems);rems=Math.min(rems*1.4,10000)}
function connect(){const p=location.protocol==="https:"?"wss:":"ws:";
ws=new WebSocket(p+"//"+location.host+"/ws"+(tokenEl.value?"?token="+encodeURIComponent(tokenEl.value):""));
ws.onopen=()=>{statusEl.textContent="ÇEVRİMİÇİ";rems=1500};
ws.onclose=()=>{statusEl.textContent="BAĞLANTI KESİLDİ";schedule()};
ws.onerror=()=>{try{ws.close()}catch(e){} schedule()};
ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==="response"||m.type==="welcome")add(m.text,"jarvis")}catch(_){}}}
function send(text){text=(text||input.value).trim();if(!text)return;add(text,"me");input.value="";
if(ws&&ws.readyState===1){ws.send(JSON.stringify({type:"command",text,speak:true}))}
else{fetch(location.origin+"/api/command",{method:"POST",headers:{"Content-Type":"application/json","X-JARVIS-Token":tokenEl.value},body:JSON.stringify({text})})
.then(r=>r.json()).then(j=>add(j.reply||"Boş yanıt","jarvis")).catch(()=>add("Bağlantı yok, sunucuyu kontrol edin.","jarvis"))}}
$("send").onclick=()=>send();input.addEventListener("keydown",e=>{if(e.key==="Enter")send()});
$("mic").onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){add("Tarayıcı ses tanımı desteklemiyor (Chrome önerilir).","jarvis");return}
const r=new SR();r.lang="tr-TR";r.onresult=e=>send(e.results[0][0].transcript);
r.onerror=()=>add("Ses dinlenemedi.","jarvis");r.start();add("Dinliyorum…","jarvis")};
connect();
</script></body></html>
